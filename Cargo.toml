[workspace]
resolver = "2"
members = [
    "crates/jamnp-s",
    "crates/m2-oracle-proto",
    "crates/m2-reference",
    "crates/m2-emu",
    "crates/m2-scenario",
    "crates/m2-runner",
    "crates/m2-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/paritytech/jam-m2-conformance"

# Two polkajam crates, as git dependencies pinned to a commit (DESIGN.md §8).
# Nothing from polkajam is vendored into this repository.
#
# `jam-node` is **not** here. The reference engine runs out of process, in
# `oracle/`, which is outside this workspace and is the only thing that
# depends on the node crate and its `hazmat` feature -- whose own docs say
# its interfaces may change at any time. What is left here are the types and
# the codecs, which the harness needs to read what comes off the wire.
#
# Not from crates.io, though both are published at 0.1.29 and the pin's
# workspace version is 0.1.29 too. They are different code: the published
# `ServiceActivityRecord` has `provided_count: u16` where the pin has `u32`,
# and that struct derives `Encode`, so the two disagree about bytes in the
# state the N1 lane diffs. polkajam publishes 0.1.x from a moving trunk, so a
# version number does not identify a revision. findings.md §6 has the diff
# and the check to repeat on a re-pin.
#
# This pin is the single source of the polkajam revision for the workspace;
# `oracle/Cargo.toml` carries the same one and `scripts/prepare-nut.sh` reads
# it from there to build both binaries, so the node under test and the engine
# that grades it are the same build. Re-pinning is deliberate -- upstream HEAD
# has broken this workspace three times in four weeks -- so move it at most
# once per milestone, in a commit of its own that records what changed.
[workspace.dependencies]
jam-types = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "b1ea8aca42b1078fd89883da66e58a9304ff0d77" }
jam-std-common = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "b1ea8aca42b1078fd89883da66e58a9304ff0d77" }

async-trait = "0.1"
quinn = { version = "0.11", features = ["rustls", "runtime-tokio", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", features = ["ring"] }
ed25519-consensus = { version = "2.1.0" }
x509-parser = "0.17"
tokio = { version = "1", features = ["full", "test-util"] }
futures = "0.3"
clap = { version = "4.5.13", features = ["derive", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "2.0"
blake2b_simd = "1"
rand = "0.8"

[profile.release]
opt-level = 2

# Ring-VRF proving was the harness's one hot path, and it is now the oracle's:
# `oracle/Cargo.toml` carries this override for itself. What is left in this
# workspace is signature *verification* and the codecs, which are not free
# either -- a lane verifies every ticket it was sent -- so the dependencies
# stay optimized while our own crates keep full debug info.
[profile.dev.package."*"]
opt-level = 3
